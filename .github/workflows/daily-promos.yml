name: Daily DoyinTech Promo Pack

on:
  schedule:
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate daily professional SVG promos
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          DIR="daily/$DATE"
          mkdir -p "$DIR"
          TITLE="$(curl -L --max-time 20 -s https://doyintech.vercel.app/ | sed -n 's:.*<title>\(.*\)</title>.*:\1:p' | head -1 | sed 's/<[^>]*>//g')"
          [ -n "$TITLE" ] || TITLE="DoyinTech — Smart Digital Solution"
          make_svg () {
            local n="$1" headline="$2" body="$3" services="$4"
            cat > "$DIR/$n.svg" <<SVG
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#0b2a52"/><stop offset="1" stop-color="#050a12"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22a7ff"/><stop offset="1" stop-color="#ff8a24"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1360" cy="120" r="230" fill="#1687ff" opacity=".12"/><circle cx="250" cy="790" r="260" fill="#ff7a18" opacity=".08"/>
<g transform="translate(90 78)"><rect width="64" height="64" rx="16" fill="url(#accent)"/><text x="82" y="42" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">DOYINTECH</text></g>
<text x="95" y="280" font-family="Arial,sans-serif" font-size="68" font-weight="800" fill="#fff">$headline</text><rect x="96" y="315" width="120" height="6" rx="3" fill="url(#accent)"/>
<text x="96" y="385" font-family="Arial,sans-serif" font-size="30" fill="#d7e3ef">$body</text><text x="96" y="455" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#55b9ff">$services</text>
<rect x="1080" y="260" width="360" height="330" rx="28" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".16"/><rect x="1115" y="298" width="290" height="18" rx="9" fill="#fff" fill-opacity=".16"/><rect x="1115" y="348" width="210" height="14" rx="7" fill="#55b9ff" fill-opacity=".75"/><rect x="1115" y="382" width="250" height="14" rx="7" fill="#fff" fill-opacity=".12"/><rect x="1115" y="416" width="180" height="14" rx="7" fill="#fff" fill-opacity=".12"/><rect x="1115" y="475" width="135" height="65" rx="15" fill="#1687ff" fill-opacity=".22"/><rect x="1270" y="475" width="135" height="65" rx="15" fill="#ff8a24" fill-opacity=".16"/>
<text x="96" y="795" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">doyintech.vercel.app</text><text x="1500" y="795" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#8ea4ba">$TITLE</text>
</svg>
SVG
          }
          make_svg "01-websites.svg" "WEBSITES THAT WORK" "Professional digital experiences built around your business." "WEBSITES • LANDING PAGES • BUSINESS PLATFORMS"
          make_svg "02-crm.svg" "YOUR BUSINESS. ONE SMART SYSTEM." "Custom CRM solutions for organized customer operations." "CRM • CUSTOMER MANAGEMENT • WORKFLOW"
          make_svg "03-erp.svg" "RUN OPERATIONS WITH CLARITY" "Purpose-built systems for the way your organization works." "ERP • OPERATIONS • STAFF MANAGEMENT"
          make_svg "04-database.svg" "MAKE YOUR DATA WORK" "Structured databases and applications for reliable information." "DATABASE DESIGN • DATA MANAGEMENT • BUSINESS APPS"
          make_svg "05-internal-systems.svg" "DIGITALIZE YOUR OFFICE" "Move repetitive processes into secure internal systems." "INTERNAL SYSTEMS • AUTOMATION • PORTALS"
          make_svg "06-web-apps.svg" "FROM IDEA TO WEB APP" "Build applications around real users and real business processes." "WEB APPS • DASHBOARDS • CUSTOM PLATFORMS"
          make_svg "07-it-consulting.svg" "THE RIGHT TECH STARTS WITH A PLAN" "Practical technology direction before you invest." "IT CONSULTING • STRATEGY • SOLUTIONS"
          make_svg "08-growth.svg" "BUILD DIGITAL INFRASTRUCTURE FOR GROWTH" "Technology that helps businesses organize, serve and scale." "BUSINESS SOFTWARE • DIGITAL TRANSFORMATION"
          make_svg "09-solutions.svg" "ONE TECH PARTNER. MANY SOLUTIONS." "Websites, apps, CRM, ERP, databases and internal systems." "WEB • APPS • SYSTEMS • DATA"
          make_svg "10-cta.svg" "READY TO BUILD SOMETHING BETTER?" "Start your next digital project with DoyinTech." "VISIT DOYINTECH.VERCEL.APP"
          printf '%s\n' "# DoyinTech Daily Promo — $DATE" "Source: https://doyintech.vercel.app" "Homepage title observed: $TITLE" > "$DIR/SOURCE.txt"
      - name: Commit daily pack
        run: |
          git config user.name "doyintech-promo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/
          git diff --cached --quiet || git commit -m "Generate DoyinTech daily promo pack $(date -u +%Y-%m-%d)"
          git push
